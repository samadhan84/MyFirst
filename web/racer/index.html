<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7dd3fc">
<title>Dhruvil Racer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #7dd3fc; touch-action: none; user-select: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  canvas { display: block; }
  .hud {
    position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 14px 0; pointer-events: none;
    font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.6);
  }
  .hud div { background: rgba(0,0,0,.35); border-radius: 12px; padding: 6px 12px; min-width: 70px; text-align: center; }
  .hud small { display: block; font-size: .7rem; font-weight: 500; opacity: .85; }
  .hud span { font-size: 1.25rem; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 20, 30, .5); text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 2.6rem; letter-spacing: 1px; text-shadow: 0 3px 8px rgba(0,0,0,.5); }
  .overlay h1 span { color: #facc15; }
  .overlay p { margin: 10px 0; font-size: 1.1rem; opacity: .95; }
  .overlay .big { font-size: 2rem; font-weight: 800; color: #facc15; }
  .overlay button {
    margin-top: 16px; border: none; border-radius: 999px; padding: 14px 40px;
    font-size: 1.2rem; font-weight: 800; background: #facc15; color: #1f2937; cursor: pointer;
  }
  .overlay button:focus { outline: 4px solid #fff; }
  .hint { font-size: .9rem !important; opacity: .85 !important; }
  .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .flash.on { opacity: .7; transition: none; }
</style>
</head>
<body>
<div class="hud">
  <div><small>SCORE</small><span id="score">0</span></div>
  <div><small>SPEED</small><span id="speed">0</span></div>
  <div><small>BEST</small><span id="best">0</span></div>
</div>
<div class="flash" id="flash"></div>

<div class="overlay" id="overlay">
  <h1>Dhruvil <span>Racer</span></h1>
  <div id="result"></div>
  <p class="hint" id="hint">Tap the left or right side to change lanes.<br>Dodge the cars and grab the coins!</p>
  <button id="play">PLAY</button>
</div>

<script src="three.min.js"></script>
<script>
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('play');
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');
const bestEl = document.getElementById('best');
const resultEl = document.getElementById('result');
const flashEl = document.getElementById('flash');

// World units: a lane is 3 wide, a car about 4 long. The player sits at z = 0 and the world moves toward +z.
const LANES = [-3, 0, 3];
const START_SPEED = 28, MAX_SPEED = 64, ACCEL = 0.6;
// Each lane's traffic moves at one speed, so cars in a lane never drive through each other.
const LANE_SPEED = [8, 11, 6];
const CAR_LEN = 4, CAR_W = 1.9;
const SPAWN_Z = -140, SEGMENT = 12;

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7dd3fc);
scene.fog = new THREE.Fog(0x7dd3fc, 45, 130);

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3f6b2a, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-6, 12, 6);
scene.add(sun);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
const M = {
  grass: mat(0x3f9142), grass2: mat(0x378239), road: mat(0x3b3b45), line: mat(0xf1f5f9),
  red: mat(0xdc2626), white: mat(0xf8fafc), tyre: mat(0x111111), glass: mat(0x1e293b),
  head: new THREE.MeshBasicMaterial({ color: 0xfef9c3 }), tail: new THREE.MeshBasicMaterial({ color: 0xef4444 }),
  trunk: mat(0x7c4a24), leaf: mat(0x1f7a35), leaf2: mat(0x2e9e48),
  coin: new THREE.MeshLambertMaterial({ color: 0xfacc15, emissive: 0x6b4f00 }),
  shadow: new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false }),
};

const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  wheel: new THREE.CylinderGeometry(0.42, 0.42, 0.35, 14).rotateZ(Math.PI / 2),
  plane: new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
  coin: new THREE.CylinderGeometry(0.7, 0.7, 0.18, 24).rotateX(Math.PI / 2),
  trunk: new THREE.CylinderGeometry(0.25, 0.3, 1.4, 8),
  cone: new THREE.ConeGeometry(1.3, 3, 8),
};
function mesh(geo, material, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(geo, material);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  return m;
}

// Ground: grass everywhere, a road on top.
const ground = mesh(G.plane, M.grass, 200, 1, 300, 0, -0.01, -100);
scene.add(ground);
scene.add(mesh(G.plane, M.road, 9, 1, 300, 0, 0, -100));

// Scrolling pieces: lane dashes, kerbs, grass stripes and trees. They loop around the SEGMENT length.
const scrollers = [];
function addScroller(obj, period) { obj.userData.period = period; obj.userData.z0 = obj.position.z; scrollers.push(obj); scene.add(obj); }
const ROAD_LOOP = Math.ceil((20 - SPAWN_Z) / SEGMENT) * SEGMENT; // a whole number of segments, so the loop is seamless
for (let z = SPAWN_Z; z < SPAWN_Z + ROAD_LOOP; z += SEGMENT) {
  for (const x of [-1.5, 1.5]) addScroller(mesh(G.box, M.line, 0.18, 0.02, 4, x, 0.01, z), ROAD_LOOP);
  for (const side of [-4.7, 4.7]) {
    addScroller(mesh(G.box, M.red, 0.5, 0.15, SEGMENT / 2, side, 0.07, z), ROAD_LOOP);
    addScroller(mesh(G.box, M.white, 0.5, 0.15, SEGMENT / 2, side, 0.07, z + SEGMENT / 2), ROAD_LOOP);
  }
  addScroller(mesh(G.plane, M.grass2, 200, 1, SEGMENT / 2, 0, -0.005, z), ROAD_LOOP);
}
function makeTree(x, z) {
  const t = new THREE.Group();
  t.add(mesh(G.trunk, M.trunk, 1, 1, 1, 0, 0.7, 0));
  t.add(mesh(G.cone, Math.random() < 0.5 ? M.leaf : M.leaf2, 1, 1, 1, 0, 2.6, 0));
  const s = 0.8 + Math.random() * 0.7;
  t.scale.set(s, s, s);
  t.position.set(x, 0, z);
  return t;
}
const TREE_STEP = 7, TREE_LOOP = Math.ceil((20 - SPAWN_Z) / TREE_STEP) * TREE_STEP;
for (let z = SPAWN_Z; z < SPAWN_Z + TREE_LOOP; z += TREE_STEP) {
  addScroller(makeTree(-8 - Math.random() * 10, z + Math.random() * 4), TREE_LOOP);
  addScroller(makeTree(8 + Math.random() * 10, z + Math.random() * 4), TREE_LOOP);
}

// ---------- racing cars ----------
// Body and cockpit are side profiles (x = forward, y = up) extruded across the car's width.
function extrudeProfile(points, width, bevel) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (const [x, y] of points.slice(1)) shape.lineTo(x, y);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: width - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 4,
  });
  geo.translate(0, 0, -(width - bevel * 2) / 2);
  geo.rotateY(Math.PI / 2); // profile's forward (+x) becomes the car's forward (-z)
  return geo;
}
const BODY_PROFILE = [
  [-2.0, 0.22], [-2.02, 0.78], [-1.3, 0.84], [-0.9, 0.86], [0.6, 0.76], [1.3, 0.6], [1.85, 0.44],
  [2.02, 0.32], [1.95, 0.18], [1.3, 0.14], [-1.3, 0.14],
];
const CANOPY_PROFILE = [[-1.05, 0.8], [-0.55, 1.2], [0.1, 1.24], [0.95, 0.74]];
G.body = extrudeProfile(BODY_PROFILE, CAR_W - 0.1, 0.1);
// The stripe's bevel is a hair bigger than the body's, so it sits just on top of the paint.
G.stripe = extrudeProfile(BODY_PROFILE, 0.36, 0.115);
G.canopy = extrudeProfile(CANOPY_PROFILE, CAR_W * 0.62, 0.12);
G.tyre = new THREE.CylinderGeometry(1, 1, 1, 20).rotateZ(Math.PI / 2);
G.number = new THREE.PlaneGeometry(1, 1);

const phong = (c, shininess = 80) => new THREE.MeshPhongMaterial({ color: c, shininess, specular: 0x555555 });
M.glassTint = new THREE.MeshPhongMaterial({ color: 0x0f172a, shininess: 140, specular: 0xffffff });
M.rim = phong(0xd1d5db, 120);
M.carbon = phong(0x1f2937, 40);
M.tyreRubber = new THREE.MeshLambertMaterial({ color: 0x141414 });
M.exhaust = phong(0x6b7280, 100);
const paints = {};
const paint = c => paints[c] || (paints[c] = phong(c));

// Race number roundel, drawn once per number.
const numberMats = {};
function numberMat(n) {
  if (numberMats[n]) return numberMats[n];
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(64, 64, 60, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#111';
  g.font = `bold ${String(n).length > 1 ? 64 : 80}px system-ui, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(n, 64, 70);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return (numberMats[n] = new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
}

function makeWheel(r, w) {
  const wheel = new THREE.Group();
  wheel.add(mesh(G.tyre, M.tyreRubber, w, r, r, 0, 0, 0));
  wheel.add(mesh(G.tyre, M.rim, w + 0.02, r * 0.62, r * 0.62, 0, 0, 0));
  for (let i = 0; i < 3; i++) { // spokes, so you can see the wheel turning
    const spoke = mesh(G.box, M.carbon, w + 0.04, r * 1.1, r * 0.14, 0, 0, 0);
    spoke.rotation.x = (i * Math.PI) / 3;
    wheel.add(spoke);
  }
  return wheel;
}

function makeCar(team) {
  const [color, stripe, number] = team;
  const car = new THREE.Group();
  car.userData.wheels = [];
  car.add(mesh(G.plane, M.shadow, CAR_W + 0.6, 1, CAR_LEN + 0.6, 0, 0.02, 0));
  car.add(new THREE.Mesh(G.body, paint(color)));
  car.add(new THREE.Mesh(G.stripe, paint(stripe)));
  car.add(new THREE.Mesh(G.canopy, M.glassTint));

  // wheels: slightly bigger at the back, like a real race car
  for (const [x, z, r, w] of [[-0.98, -1.25, 0.38, 0.34], [0.98, -1.25, 0.38, 0.34], [-1.0, 1.3, 0.42, 0.4], [1.0, 1.3, 0.42, 0.4]]) {
    const wheel = makeWheel(r, w);
    wheel.position.set(x, r, z);
    wheel.userData.r = r;
    car.userData.wheels.push(wheel);
    car.add(wheel);
  }

  // front splitter and rear wing
  car.add(mesh(G.box, M.carbon, CAR_W + 0.1, 0.05, 0.35, 0, 0.14, -1.95));
  car.add(mesh(G.box, paint(color), CAR_W + 0.2, 0.07, 0.5, 0, 1.28, 1.75));
  for (const x of [-(CAR_W / 2 + 0.1), CAR_W / 2 + 0.1]) car.add(mesh(G.box, M.carbon, 0.05, 0.4, 0.62, x, 1.18, 1.75));
  for (const x of [-0.45, 0.45]) car.add(mesh(G.box, M.carbon, 0.07, 0.45, 0.14, x, 1.02, 1.78));
  const wingNumber = mesh(G.number, numberMat(number), 0.46, 0.46, 1, 0, 1.325, 1.75);
  wingNumber.rotation.x = -Math.PI / 2;
  car.add(wingNumber);
  for (const side of [-1, 1]) {
    const n = mesh(G.number, numberMat(number), 0.62, 0.62, 1, side * (CAR_W / 2 + 0.005), 0.5, 0.1);
    n.rotation.y = side * Math.PI / 2;
    car.add(n);
  }

  // lights and exhausts
  for (const x of [-0.6, 0.6]) {
    car.add(mesh(G.box, M.head, 0.42, 0.09, 0.12, x, 0.4, -2.06));
    car.add(mesh(G.box, M.tail, 0.5, 0.12, 0.05, x, 0.66, 2.13));
  }
  for (const x of [-0.3, 0.3]) car.add(mesh(G.tyre, M.exhaust, 0.3, 0.07, 0.07, x, 0.3, 2.16).rotateY(Math.PI / 2));
  return car;
}

function spinWheels(car, groundSpeed, dt) {
  for (const w of car.userData.wheels) w.rotation.x -= (groundSpeed / w.userData.r) * dt;
}

// Rival teams: [body, stripe, number]
const TEAMS = [
  [0x2563eb, 0xf8fafc, 7], [0x16a34a, 0xfacc15, 12], [0x7c3aed, 0xf8fafc, 22], [0xf97316, 0x111827, 33],
  [0xfacc15, 0x111827, 44], [0xdb2777, 0xf8fafc, 5], [0xe5e7eb, 0xdc2626, 63], [0x0891b2, 0xf97316, 18],
];

const playerCar = makeCar([0xdc2626, 0xf8fafc, 1]);
scene.add(playerCar);

// ---------- game state ----------
let state = 'start', lastT = 0, overAt = 0, shake = 0;
let player, cars, coins, speed, dist, coinCount, carGap, coinGap, score;
let best = 0;
try { best = +localStorage.getItem('dhruvilRacerBest') || 0; } catch (e) {}
bestEl.textContent = best;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // On a narrow (portrait) screen, raise and back up the camera so all three lanes stay in view.
  // t = 0 for landscape, 1 for a typical tall phone.
  const t = Math.min(1, Math.max(0, (1 / camera.aspect - 1) / 1.2));
  camera.position.set(0, 6 + 5 * t, 10 + 5 * t);
  camera.lookAt(0, 0, -14 - 9 * t);
  camera.updateProjectionMatrix();
}

function clearWorld() {
  for (const o of (cars || []).concat(coins || [])) scene.remove(o.mesh);
}

function reset() {
  clearWorld();
  player = { lane: 1, x: 0 };
  cars = []; coins = [];
  speed = START_SPEED; dist = 0; coinCount = 0; score = 0;
  carGap = 0; coinGap = 20;
  playerCar.position.set(0, 0, 0);
  playerCar.rotation.set(0, 0, 0);
  scoreEl.textContent = 0;
}

function start() {
  if (state === 'play') return;
  if (state === 'over' && performance.now() - overAt < 600) return; // avoid instant accidental restart
  if (state !== 'pause') reset();
  state = 'play';
  overlay.classList.add('hidden');
}

function steer(dir) {
  if (state !== 'play') return;
  player.lane = Math.max(0, Math.min(2, player.lane + dir));
}

function buzz(ms) {
  if (window.AndroidHaptics) AndroidHaptics.tap();
  else if (navigator.vibrate) navigator.vibrate(ms);
}

// Pick a lane for a new car so the three lanes are never all blocked at once.
function freeLane() {
  const blocked = new Set(cars.filter(c => c.z < SPAWN_Z + CAR_LEN * 2.8).map(c => c.lane));
  const options = [0, 1, 2].filter(l => blocked.size < 2 || blocked.has(l));
  return options[Math.floor(Math.random() * options.length)];
}

function update(dt) {
  speed = Math.min(MAX_SPEED, speed + ACCEL * dt);
  const move = speed * dt;
  dist += move;

  // lane change with a little lean
  const targetX = LANES[player.lane];
  const dx = targetX - player.x;
  player.x += dx * Math.min(1, dt * 12);
  playerCar.position.x = player.x;
  playerCar.rotation.y = -dx * 0.08;
  playerCar.rotation.z = dx * 0.03;

  carGap -= move;
  if (carGap <= 0) {
    const lane = freeLane();
    const c = { lane, z: SPAWN_Z, mesh: makeCar(TEAMS[Math.floor(Math.random() * TEAMS.length)]) };
    c.mesh.position.set(LANES[lane], 0, c.z);
    scene.add(c.mesh);
    cars.push(c);
    for (const coin of coins) if (coin.lane === lane && coin.z < SPAWN_Z + CAR_LEN * 1.5) coin.taken = true; // no coins inside cars
    carGap = CAR_LEN * (2.4 + Math.random() * 2.6);
  }
  coinGap -= move;
  if (coinGap <= 0) {
    const busy = new Set(cars.filter(c => c.z < SPAWN_Z + CAR_LEN * 2).map(c => c.lane));
    const free = [0, 1, 2].filter(l => !busy.has(l));
    if (free.length) {
      const lane = free[Math.floor(Math.random() * free.length)];
      const c = { lane, z: SPAWN_Z, mesh: new THREE.Mesh(G.coin, M.coin) };
      c.mesh.position.set(LANES[lane], 1, c.z);
      scene.add(c.mesh);
      coins.push(c);
    }
    coinGap = CAR_LEN * (3 + Math.random() * 4);
  }

  for (const c of cars) { c.z += (speed - LANE_SPEED[c.lane]) * dt; c.mesh.position.z = c.z; spinWheels(c.mesh, LANE_SPEED[c.lane], dt); }
  spinWheels(playerCar, speed, dt);
  for (const c of coins) { c.z += (speed - LANE_SPEED[c.lane]) * dt; c.mesh.position.z = c.z; c.mesh.rotation.y += dt * 4; }
  for (const o of scrollers) {
    const p = o.userData.period;
    o.position.z = ((o.userData.z0 - SPAWN_Z + dist) % p) + SPAWN_Z;
  }

  const gone = o => { if (o.z > 15 || o.taken) { scene.remove(o.mesh); return false; } return true; };
  cars = cars.filter(gone);
  coins = coins.filter(gone);

  // Collisions (slightly smaller boxes feel fairer)
  for (const c of cars) {
    if (Math.abs(LANES[c.lane] - player.x) < CAR_W * 0.85 && Math.abs(c.z) < CAR_LEN * 0.88) return crash();
  }
  for (const c of coins) {
    if (Math.abs(LANES[c.lane] - player.x) < 1.5 && Math.abs(c.z) < CAR_LEN * 0.6) {
      c.taken = true; coinCount++; buzz(10);
    }
  }

  score = Math.floor(dist / 3) + coinCount * 10;
  scoreEl.textContent = score;
  speedEl.textContent = Math.round(speed * 3.6);
}

function crash() {
  state = 'over';
  overAt = performance.now();
  shake = 0.6;
  buzz(250);
  flashEl.classList.add('on');
  requestAnimationFrame(() => flashEl.classList.remove('on'));
  const newBest = score > best;
  if (newBest) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('dhruvilRacerBest', best); } catch (e) {}
  }
  resultEl.innerHTML = `<p>💥 Crash!</p><p class="big">${score}</p>` +
    `<p>${newBest ? '🏆 New best score!' : 'Best: ' + best}</p>`;
  document.getElementById('hint').style.display = 'none';
  playBtn.textContent = 'PLAY AGAIN';
  overlay.classList.remove('hidden');
  playBtn.focus();
}

function frame(t) {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;
  if (state === 'play') update(dt);
  else if (state === 'start') { // gentle movement behind the title screen
    dist += 8 * dt;
    for (const o of scrollers) o.position.z = ((o.userData.z0 - SPAWN_Z + dist) % o.userData.period) + SPAWN_Z;
  }
  if (shake > 0) {
    shake = Math.max(0, shake - dt);
    playerCar.rotation.y = Math.sin(t / 30) * shake * 0.5;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- controls ----------
renderer.domElement.addEventListener('pointerdown', e => steer(e.clientX < innerWidth / 2 ? -1 : 1));
playBtn.addEventListener('click', e => { e.stopPropagation(); start(); });
overlay.addEventListener('pointerdown', () => start());
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') { steer(-1); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd') { steer(1); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { start(); e.preventDefault(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') {
    state = 'pause';
    resultEl.innerHTML = '<p class="big">Paused</p>';
    document.getElementById('hint').style.display = 'none';
    playBtn.textContent = 'CONTINUE';
    overlay.classList.remove('hidden');
  }
});
addEventListener('resize', resize);

resize();
reset();
playBtn.focus();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
