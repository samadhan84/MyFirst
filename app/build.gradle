plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dhruvil.tic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dhruvil.tic'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // The game itself lives in /web so the same files also work as a website.
    sourceSets {
        main {
            assets.srcDirs = ['../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
